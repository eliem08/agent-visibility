[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-visibility"
version = "0.1.0"
description = "SEMrush for personal agent platforms: track how agents recommend your brand"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-visibility = "agent_visibility.__main__:main"

[tool.setuptools]
packages = ["agent_visibility"]
